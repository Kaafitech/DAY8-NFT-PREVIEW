<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="card">
        <div class="card__img-container">
          <img
            class="card__img"
            src="./images/image-equilibrium.jpg"
            alt="Equilibrium"
          />
          <div class="card__view-icon">
            <svg width="48" height="48" xmlns="http://www.w3.org/2000/svg">
              <g fill="none" fill-rule="evenodd">
                <path d="M0 0h48v48H0z" />
                <path
                  d="M24 9C14 9 5.46 15.22 2 24c3.46 8.78 12 15 22 15 10.01 0 18.54-6.22 22-15-3.46-8.78-11.99-15-22-15zm0 25c-5.52 0-10-4.48-10-10s4.48-10 10-10 10 4.48 10 10-4.48 10-10 10zm0-16c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z"
                  fill="#FFF"
                  fill-rule="nonzero"
                />
              </g>
            </svg>
          </div>
        </div>

        <h1 class="card__heading text-preset-1">Equilibrium #3429</h1>
        <p class="card__desc text-preset-2">
          Our Equilibrium collection promotes balance and calm.
        </p>
        <div class="eth flex">
          <div class="ethleft flex">
            <img src="./images/icon-ethereum.svg" alt="icon-ethereum" />
            <p class="text-preset-4">0.041 ETH</p>
          </div>
          <div class="ethright flex">
            <img src="./images/icon-clock.svg" alt="icon-clock" />
            <p class="text-preset-3">3 days left</p>
          </div>
        </div>
        <section class="card__line"></section>
        <div class="card__footer flex">
          <img
            class="image-avatar"
            src="./images/image-avatar.png"
            alt="image-avatar"
          />
          <p>Creation of <span class="author">Jules Wyvern</span></p>
        </div>
      </div>
      <!-- end of card-->
    </main>
  </body>
</html>
